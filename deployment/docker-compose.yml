# bulkhaul 全栈编排（C1：docker 一键起全栈）
# 用法：
#   cp .env.example .env   # 填生产密钥（或本地用默认值）
#   docker compose up -d --build
#   前端 http://localhost:8080  后端 http://localhost:8081  健康 http://localhost:8081/api/health
# 生产：JWT_SECRET / DB_PASSWORD / MYSQL_ROOT_PASSWORD 必须覆盖默认值；
#       后端以 application-prod.yml 启动（SPRING_PROFILES_ACTIVE=prod）可强制 env 注入。
services:
  mysql:
    image: mysql:8.0
    container_name: blms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-blms123456}
      MYSQL_DATABASE: blms
      MYSQL_USER: blms
      MYSQL_PASSWORD: ${DB_PASSWORD:-blms123456}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-blms123456}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    ports:
      - "3306:3306"   # 本地调试映射；生产可注释（仅内网访问）

  redis:
    image: redis:7-alpine
    container_name: blms-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "6379:6379"   # 本地调试映射；生产可注释

  backend:
    build: ./bulkhaul-server
    container_name: blms-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # A4：敏感项经环境变量注入（compose 内网地址，非 127.0.0.1）
      DB_URL: jdbc:mysql://mysql:3306/blms?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: blms
      DB_PASSWORD: ${DB_PASSWORD:-blms123456}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-blms-demo-secret-key-change-me-0123456789abcdef}
      JWT_TTL_MINUTES: "480"
      SERVER_PORT: "8081"
      SCHEDULER_AUTO_ENABLED: ${SCHEDULER_AUTO_ENABLED:-true}
      LOG_LEVEL_COM_BLMS: ${LOG_LEVEL_COM_BLMS:-info}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  frontend:
    build: ./bulkhaul-manage-web
    container_name: blms-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # nginx 反代 /api → 后端服务名（envsubst 模板替换）
      BACKEND_UPSTREAM: backend
    ports:
      - "8080:80"

volumes:
  mysql-data:
  redis-data:
